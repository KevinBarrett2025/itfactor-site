<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found | iT Factor</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="theme-color" content="#09090c" />
  <link rel="icon" href="/favicon.png" type="image/png" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #07070a;
      --bg-2: #0d0d14;
      --surface: rgba(18, 18, 28, 0.86);
      --border: rgba(255, 255, 255, 0.12);
      --text: rgba(255, 255, 255, 0.95);
      --muted: rgba(255, 255, 255, 0.72);
      --accent: #b26bff;
      --accent-2: #5d87ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
      background:
        radial-gradient(900px 560px at 12% 0%, rgba(178, 107, 255, 0.18), transparent 60%),
        radial-gradient(820px 520px at 88% 18%, rgba(93, 135, 255, 0.12), transparent 58%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(680px, 100%);
      padding: clamp(32px, 7vw, 64px);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 30px;
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.48);
      backdrop-filter: blur(18px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 34px;
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      text-decoration: none;
    }

    .brand img {
      width: 44px;
      height: 44px;
      border-radius: 14px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.35rem, 8vw, 4.5rem);
      line-height: 1;
      letter-spacing: -0.045em;
    }

    p {
      max-width: 480px;
      margin: 22px auto 30px;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.12rem);
      line-height: 1.65;
    }

    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 13px 22px;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border-radius: 14px;
      box-shadow: 0 14px 34px rgba(93, 135, 255, 0.24);
    }

    a:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      main {
        padding: 32px 22px 36px;
        border-radius: 24px;
      }

      .brand {
        margin-bottom: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="iT Factor home">
      <img src="/assets/brand/logo-176-v1.webp" alt="" width="44" height="44" />
      <span>iT Factor</span>
    </a>
    <p class="eyebrow">404 error</p>
    <h1>Page not found</h1>
    <p>The page you’re looking for may have moved or may no longer exist. You can return to the iT Factor homepage to keep exploring.</p>
    <a class="home-link" href="/">Back to homepage</a>
  </main>
</body>
</html>
